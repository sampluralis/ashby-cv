<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ashby CV Summarizer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: #0b1220; color: #e8eefc; }
    .card { background: #111a2e; border: 1px solid #1f2a44; border-radius: 16px; }
    .muted { color: #a9b7d6; }
    .form-control, .form-select { background: #0f1730; color: #e8eefc; border-color: #2a3a63; }
    .form-control:focus, .form-select:focus { border-color: #5b7cfa; box-shadow: 0 0 0 .2rem rgba(91,124,250,.15); }
    .btn-primary { background: #5b7cfa; border: none; }
    .btn-outline-light { border-color: #2a3a63; color: #e8eefc; }
    .btn-outline-light:hover { background: rgba(91,124,250,.15); }
    pre {
      background: #0f1730;
      border: 1px solid #2a3a63;
      padding: 12px;
      border-radius: 12px;
      color: #e8eefc;
      white-space: pre-wrap;
      margin-bottom: 0;
      min-height: 280px;
    }
    .pill { border: 1px solid #2a3a63; border-radius: 999px; padding: .25rem .6rem; font-size: .85rem; }
    .spinner-border { width: 1.2rem; height: 1.2rem; }
    .smallmono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .select-help { font-size: .85rem; }
  </style>
</head>

<body>
<div class="container py-4">
  <div class="d-flex align-items-start justify-content-between mb-4">
    <div>
      <h2 class="mb-1">Ashby CV Summarizer</h2>
      <div class="muted">Filter by <span class="smallmono">jobId</span>, search candidates by name/ID, generate CV summaries.</div>
    </div>
    <div class="d-flex gap-2 align-items-center">
      <button id="refreshBtn" class="btn btn-outline-light">Refresh candidates</button>
      <span id="cacheInfo" class="pill muted">cache</span>
    </div>
  </div>

  <div class="row g-3">
    <!-- Left panel -->
    <div class="col-lg-4">
      <div class="card p-3">
        <!-- Job selector -->
        <div class="mb-3">
          <label class="form-label">Job</label>
          <select id="jobSelect" class="form-select"></select>
          <div class="muted select-help mt-2" id="jobStatus">Loading jobs…</div>
        </div>

        <!-- Search -->
        <div class="mb-3">
          <label class="form-label">Search candidates</label>
          <input id="searchBox" class="form-control" placeholder="Type a name or candidate id…" />
          <div class="muted select-help mt-2" id="searchStatus"></div>
        </div>

        <!-- Candidates -->
        <div class="mb-2">
          <div class="d-flex justify-content-between align-items-center">
            <label class="form-label mb-1">Candidates</label>
            <span class="muted select-help" id="countBadge"></span>
          </div>
          <select id="candidateSelect" class="form-select" size="12"></select>
          <div class="muted select-help mt-2">
            Tip: change the Job dropdown to filter, or search by name.
          </div>
        </div>

        <!-- Controls -->
        <div class="d-flex align-items-center justify-content-between mt-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="detailedToggle">
            <label class="form-check-label" for="detailedToggle">Detailed</label>
          </div>
          <button id="summarizeBtn" class="btn btn-primary">Generate summary</button>
        </div>

        <div class="mt-3 muted small" id="candidateMeta"></div>
      </div>
    </div>

    <!-- Right panel -->
    <div class="col-lg-8">
      <div class="card p-3">
        <div class="d-flex align-items-center justify-content-between">
          <h5 class="mb-0">Summary</h5>
          <div class="d-flex gap-2 align-items-center">
            <div id="loading" class="muted d-none">
              <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              <span class="ms-2">Working… (download resume + call Claude)</span>
            </div>
            <button id="copyBtn" class="btn btn-outline-light btn-sm">Copy</button>
          </div>
        </div>

        <hr />

        <pre id="summaryOut">Select a candidate and click “Generate summary”.</pre>
        <div class="muted small mt-2" id="errorOut"></div>
      </div>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
